name: Compile adapted Paper9 (TeX Live)

# TEMPORARY verification workflow — compiles the ADAPTED manuscript under a
# genuine TeX Live distribution, posts diagnostics to the PR, and commits the
# compiled PDF back to the branch from a standard runner.
# Removed after the verification run.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile ADAPTED (pdflatex + bibtex + 2x pdflatex)
        run: |
          set -o pipefail
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p1.log 2>&1 || { tail -80 p1.log; exit 1; }
          bibtex manuscript > bibtex.log 2>&1 || { cat bibtex.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p2.log 2>&1 || { tail -80 p2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p3.log 2>&1 || { tail -80 p3.log; exit 1; }
          ls -la manuscript.pdf

      - name: Diagnostics
        run: |
          {
            echo "## TeX Live compile — ADAPTED (final pass)"
            echo '```'
            grep "Output written" p3.log
            printf "errors(^!): "; grep -cE "^!" p3.log || true
            printf "undefined references: "; grep -c "There were undefined references" p3.log || true
            printf "undefined citations: "; grep -c "undefined citation" p3.log || true
            printf "overfull: "; grep -c "Overfull" p3.log || true
            printf "underfull: "; grep -c "Underfull" p3.log || true
            printf "float-too-large: "; grep -c "Float too large" p3.log || true
            grep "Float too large" p3.log || echo "(none)"
            echo '```'
          } > diagnostics.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapted-manuscript-pdf
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/diagnostics.txt
          if-no-files-found: warn

  report:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: adapted-manuscript-pdf
          path: artifact

      - name: Commit PDF back to branch
        if: always()
        run: |
          set -x
          cp artifact/manuscript.pdf Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf || echo "no manuscript.pdf in artifact"
          cp artifact/diagnostics.txt Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "NOTHING TO COMMIT"
          else
            git commit -m "CI: TeX Live-compiled adapted manuscript.pdf + diagnostics [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "PUSH FAILED"
          fi

      - name: Post diagnostics to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            let diag = '(diagnostics.txt missing)';
            try { diag = fs.readFileSync('artifact/diagnostics.txt', 'utf8'); }
            catch (e) { diag = '(artifact download failed: ' + e.message + ')'; }
            const head = `${owner}:${process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (!pulls.data.length) { console.log('No open PR for this branch; skipping.'); return; }
            const prn = pulls.data[0].number;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prn,
              body: `### ✅ Real LaTeX compile (TeX Live full) — PDF committed to branch\nCommit \`${context.sha.slice(0,7)}\` — job \`${process.env.GITHUB_RUN_ID}\`\n\n${diag}\n`
            });
