name: Compile adapted Paper9 (TeX Live)

# TEMPORARY cleanup-verification workflow — compiles BOTH the adapted manuscript
# (with the new xltabular table containers) AND the authoritative original under
# a genuine TeX Live distribution.  The compile job runs inside the texlive
# container; a separate standard-runner `report` job downloads the produced PDF +
# diagnostics and commits them back to the branch (marked [skip ci]).  Removed
# after verification.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: pdflatex --version | head -1

      - name: Compile ADAPTED (pdflatex + bibtex + 2x pdflatex)
        run: |
          set -o pipefail
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p1.log 2>&1 || { tail -80 p1.log; exit 1; }
          bibtex manuscript > bibtex.log 2>&1 || { cat bibtex.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p2.log 2>&1 || { tail -80 p2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p3.log 2>&1 || { tail -80 p3.log; exit 1; }
          ls -la manuscript.pdf

      - name: Compile ORIGINAL (authoritative, for parity)
        run: |
          set -o pipefail
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig1.log 2>&1 || { tail -60 orig1.log; exit 1; }
          bibtex PAPER9_ORIGINAL_manuscript > orig_bib.log 2>&1 || true
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig2.log 2>&1 || { tail -60 orig2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig3.log 2>&1 || { tail -60 orig3.log; exit 1; }
          ls -la PAPER9_ORIGINAL_manuscript.pdf

      - name: Diagnostics
        run: |
          {
            echo "## TeX Live cleanup-verification diagnostics"
            echo ""
            echo '```'
            echo "== ADAPTED (final pass p3) =="
            grep "Output written" p3.log || echo "NO 'Output written'"
            printf "errors(^!): "; grep -cE "^!" p3.log || true
            printf "undefined references: "; grep -c "There were undefined references" p3.log || true
            printf "undefined citations: "; grep -c "undefined citation" p3.log || true
            printf "overfull boxes: "; grep -c "Overfull" p3.log || true
            printf "underfull boxes: "; grep -c "Underfull" p3.log || true
            printf "float-too-large: "; grep -c "Float too large" p3.log || true
            grep "Float too large" p3.log || echo "(no float-too-large)"
            echo ""
            echo "== ORIGINAL (final pass orig3) =="
            grep "Output written" orig3.log || echo "NO 'Output written'"
            printf "errors(^!): "; grep -cE "^!" orig3.log || true
            printf "overfull boxes: "; grep -c "Overfull" orig3.log || true
            printf "underfull boxes: "; grep -c "Underfull" orig3.log || true
            printf "float-too-large: "; grep -c "Float too large" orig3.log || true
            grep "Float too large" orig3.log || echo "(no float-too-large)"
            echo '```'
            echo "## ADAPTED overfull list (p3, full)"
            echo '```'
            grep -n "Overfull" p3.log || echo "(none)"
            echo '```'
            echo "## ADAPTED underfull list (p3, full)"
            echo '```'
            grep -n "Underfull" p3.log || echo "(none)"
            echo '```'
            echo "## ADAPTED float-too-large context (p3)"
            echo '```'
            grep -n -B2 -A2 "Float too large" p3.log || echo "(none)"
            echo '```'
            echo "## BibTeX (adapted) warnings"
            echo '```'
            grep -inE "warning|error" bibtex.log | head -20 || echo "(none)"
            echo '```'
          } > diagnostics.txt
          cp diagnostics.txt CI_COMPILE_DIAGNOSTICS.txt
          head -30 diagnostics.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/PAPER9_ORIGINAL_manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/diagnostics.txt
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/p3.log
          if-no-files-found: warn

  report:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: compile-results
          path: artifact

      - name: Commit PDF + diagnostics back to branch
        if: always()
        run: |
          set -x
          mkdir -p Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
          cp artifact/Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf 2>/dev/null || echo "no adapted PDF in artifact"
          cp artifact/Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt 2>/dev/null || \
            cp artifact/Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/diagnostics.txt Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt 2>/dev/null || echo "no diagnostics in artifact"
          ls -la Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/ | grep -E "manuscript.pdf|DIAGNOSTICS"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf \
                  Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt
          git status --short
          if git diff --cached --quiet; then
            echo "NOTHING TO COMMIT"
          else
            git commit -m "CI: TeX Live compile (PDF + diagnostics) [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "PUSH FAILED"
          fi
