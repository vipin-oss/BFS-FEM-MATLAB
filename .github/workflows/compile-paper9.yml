name: Compile adapted Paper9 (TeX Live)

# TEMPORARY verification workflow — compiles BOTH the adapted manuscript AND
# the authoritative original manuscript under a genuine TeX Live distribution,
# extracts diagnostics from each, and posts them as a pull-request comment.
# Removed after the verification run.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: pdflatex --version | head -1

      - name: Compile ORIGINAL (authoritative)
        run: |
          set -o pipefail
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig1.log 2>&1 || { tail -60 orig1.log; exit 1; }
          bibtex PAPER9_ORIGINAL_manuscript > orig_bib.log 2>&1 || { cat orig_bib.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig2.log 2>&1 || { tail -60 orig2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig3.log 2>&1 || { tail -60 orig3.log; exit 1; }
          ls -la PAPER9_ORIGINAL_manuscript.pdf

      - name: Compile ADAPTED
        run: |
          set -o pipefail
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > adap1.log 2>&1 || { tail -60 adap1.log; exit 1; }
          bibtex manuscript > adap_bib.log 2>&1 || { cat adap_bib.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > adap2.log 2>&1 || { tail -60 adap2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > adap3.log 2>&1 || { tail -60 adap3.log; exit 1; }
          ls -la manuscript.pdf

      - name: Diagnostics summary
        run: |
          {
            echo "## TeX Live compile — ORIGINAL vs ADAPTED (final passes)"
            echo '```'
            for pair in "ORIGINAL:PAPER9_ORIGINAL_manuscript" "ADAPTED:manuscript"; do
              label=${pair%%:*}; base=${pair##*:}
              printf "%s\n" "== $label =="
              grep "Output written" ${base%.*}.log || echo "NO OUTPUT LINE"
              printf "  errors(^!): "; grep -cE "^!" ${base%.*}.log || true
              printf "  undefined references: "; grep -c "There were undefined references" ${base%.*}.log || true
              printf "  undefined citations: "; grep -c "undefined citation" ${base%.*}.log || true
              printf "  overfull boxes: "; grep -c "Overfull" ${base%.*}.log || true
              printf "  underfull boxes: "; grep -c "Underfull" ${base%.*}.log || true
              printf "  float-too-large warnings: "; grep -c "Float too large" ${base%.*}.log || true
              echo "  float-too-large details:"
              grep "Float too large" ${base%.*}.log || echo "    (none)"
            done
            echo '```'
            echo "## ORIGINAL overfull lines (first 60)"
            echo '```'
            grep "Overfull" orig3.log | head -60
            echo '```'
            echo "## ADAPTED overfull lines (first 60)"
            echo '```'
            grep "Overfull" adap3.log | head -60
            echo '```'
          } | tee diagnostics.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/PAPER9_ORIGINAL_manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/diagnostics.txt
          if-no-files-found: warn

  report:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: compile-results
          path: artifact

      - name: Post to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            let diag = '(diagnostics.txt missing)';
            try { diag = fs.readFileSync('artifact/diagnostics.txt', 'utf8'); }
            catch (e) { diag = '(artifact download failed: ' + e.message + ')'; }
            const head = `${owner}:${process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (!pulls.data.length) { console.log('No open PR for this branch; skipping.'); return; }
            const prn = pulls.data[0].number;
            const sha = context.sha.slice(0, 7);
            const body = diag.length > 60000 ? diag.slice(0, 60000) + '\n\n_(truncated)_' : diag;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prn,
              body: `### ✅ Real LaTeX compile (TeX Live full) — ORIGINAL vs ADAPTED\nCommit \`${sha}\` — job \`${process.env.GITHUB_RUN_ID}\`\n\n${body}\n`
            });
