name: Compile adapted Paper9 (TeX Live)

# TEMPORARY cleanup-verification workflow — compiles BOTH the adapted manuscript
# (with the new xltabular table containers) AND the authoritative original on a
# STANDARD runner with a minimal TeX Live install.  Fail-soft: diagnostics
# (including the pdflatex error tail) are written to the repo and committed back
# directly from the same job (no artifact transfer, no container).  Removed after
# verification.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install minimal TeX Live
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-publishers texlive-science \
            texlive-bibtex-extra texlive-binaries >/dev/null
          pdflatex --version | head -1

      - name: Compile ADAPTED (fail-soft)
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
        run: |
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p1.log 2>&1; S1=$?
          bibtex manuscript > bibtex.log 2>&1; SB=$?
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p2.log 2>&1; S2=$?
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p3.log 2>&1; S3=$?
          echo "adapted exit codes: pdflatex1=$S1 bibtex=$SB pdflatex2=$S2 pdflatex3=$S3"
          ls -la manuscript.pdf 2>/dev/null || echo "NO manuscript.pdf"
          echo "== p1 error lines =="; grep -nE "^!|^l\.[0-9]+" p1.log | head -50 || true
          echo "== p1 last 70 lines =="; tail -70 p1.log

      - name: Compile ORIGINAL (fail-soft)
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
        run: |
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig1.log 2>&1
          bibtex PAPER9_ORIGINAL_manuscript > orig_bib.log 2>&1
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig2.log 2>&1
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig3.log 2>&1
          grep "Output written" orig3.log || echo "NO original output line"
          grep -nE "^!|^l\.[0-9]+" orig3.log | head -20 || true

      - name: Diagnostics
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
        run: |
          {
            echo "## TeX Live cleanup-verification diagnostics"
            echo "run: ${{ github.run_id }}  sha: ${{ github.sha }}"
            echo ""
            echo '```'
            echo "== ADAPTED (p3) =="
            grep "Output written" p3.log 2>/dev/null || echo "NO 'Output written' — compile failed"
            printf "errors(^!): "; grep -cE "^!" p3.log 2>/dev/null || true
            printf "undefined references: "; grep -c "There were undefined references" p3.log 2>/dev/null || true
            printf "undefined citations: "; grep -c "undefined citation" p3.log 2>/dev/null || true
            printf "overfull boxes: "; grep -c "Overfull" p3.log 2>/dev/null || true
            printf "underfull boxes: "; grep -c "Underfull" p3.log 2>/dev/null || true
            printf "float-too-large: "; grep -c "Float too large" p3.log 2>/dev/null || true
            grep "Float too large" p3.log 2>/dev/null || echo "(no float-too-large)"
            echo ""
            echo "== ADAPTED FULL ERROR CONTEXT (p1, -A12 around first ^!) =="
            grep -n -A12 -m1 "^!" p1.log 2>/dev/null || echo "(no errors in p1)"
            echo ""
            echo "== ORIGINAL (orig3) =="
            grep "Output written" orig3.log 2>/dev/null || echo "NO 'Output written'"
            printf "errors(^!): "; grep -cE "^!" orig3.log 2>/dev/null || true
            printf "overfull boxes: "; grep -c "Overfull" orig3.log 2>/dev/null || true
            printf "underfull boxes: "; grep -c "Underfull" orig3.log 2>/dev/null || true
            printf "float-too-large: "; grep -c "Float too large" orig3.log 2>/dev/null || true
            grep "Float too large" orig3.log 2>/dev/null || echo "(no float-too-large)"
            echo '```'
            echo "## ADAPTED overfull list (p3)"
            echo '```'
            grep -n "Overfull" p3.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "## ADAPTED float-too-large context (p3)"
            echo '```'
            grep -n -B2 -A2 "Float too large" p3.log 2>/dev/null || echo "(none)"
            echo '```'
          } > CI_COMPILE_DIAGNOSTICS.txt
          echo "DIAGNOSTICS:"; cat CI_COMPILE_DIAGNOSTICS.txt

      - name: Commit PDF + diagnostics back
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f CI_COMPILE_DIAGNOSTICS.txt
          # only stage the PDF if it was produced and is non-empty; never delete it
          if [ -s manuscript.pdf ]; then
            git add -f manuscript.pdf
          else
            echo "no PDF produced; restoring committed copy (do not delete)"
            git checkout -- manuscript.pdf 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "NOTHING TO COMMIT"
          else
            cd "$GITHUB_WORKSPACE"
            git commit -m "CI: TeX Live compile (PDF + diagnostics) [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "PUSH FAILED"
            git log --oneline -1
          fi
