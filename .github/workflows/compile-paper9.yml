name: Compile adapted Paper9 (TeX Live)

# TEMPORARY verification workflow — compiles the adapted manuscript with a
# genuine TeX Live distribution, extracts diagnostics, and posts them as a
# pull-request comment (retrievable even when artifact download is blocked).
# Removed after the verification run.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          pdflatex --version | head -1
          bibtex --version | head -1

      - name: Compile (pdflatex + bibtex + 2x pdflatex)
        run: |
          set -o pipefail
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > pass1.log 2>&1 || { tail -80 pass1.log; exit 1; }
          bibtex manuscript > bibtex.log 2>&1 || { cat bibtex.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > pass2.log 2>&1 || { tail -80 pass2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > pass3.log 2>&1 || { tail -80 pass3.log; exit 1; }
          ls -la manuscript.pdf

      - name: Extract diagnostics
        run: |
          {
            echo "## TeX Live compile diagnostics (final pass)"
            echo '```'
            grep "Output written" pass3.log || echo "NO 'Output written' LINE FOUND"
            echo "---"
            printf "Overfull boxes: "; grep -c "Overfull" pass3.log || true
            printf "Underfull boxes: "; grep -c "Underfull" pass3.log || true
            echo "undefined references lines:"; grep -c "There were undefined references" pass3.log || true
            echo "undefined citations lines:"; grep -c "undefined citation" pass3.log || true
            echo "LaTeX errors: "; grep -cE "^!" pass3.log || true
            echo "---"
            echo "LaTeX/Reference warnings (first 30):"
            grep -E "LaTeX Warning|Package .* Warning|undefined" pass3.log | head -30
            echo '```'
            echo "BibTeX log (warnings, if any):"
            echo '```'
            grep -iE "warning|error" bibtex.log | head -20 || echo "(no bibtex warnings)"
            echo '```'
          } | tee diagnostics.txt

      - name: Upload PDF + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapted-manuscript-pdf
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/diagnostics.txt
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/pass*.log
          if-no-files-found: warn

      # Download own artifact (GitHub-internal, reliable) to hand off to reporter
      - name: Save artifact path marker
        run: echo "artifact ready"

  report:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: adapted-manuscript-pdf
          path: artifact

      - name: Post diagnostics to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            let diag = '(diagnostics.txt missing)';
            try { diag = fs.readFileSync('artifact/diagnostics.txt', 'utf8'); }
            catch (e) { diag = '(artifact download failed: ' + e.message + ')'; }
            const head = `${owner}:${process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (!pulls.data.length) {
              console.log('No open PR for this branch; skipping comment.');
              return;
            }
            const prn = pulls.data[0].number;
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner, repo, issue_number: prn,
              body: `### ✅ Real LaTeX compile verification (GitHub Actions, TeX Live full)\n` +
                    `Commit \`${sha}\` — job \`${process.env.GITHUB_RUN_ID}\`\n\n${diag}\n`
            });
