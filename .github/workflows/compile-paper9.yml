name: Compile adapted Paper9 (TeX Live)

# TEMPORARY cleanup-verification workflow.  Compile steps are fail-soft so the
# pdflatex error tail is always captured into diagnostics.txt; a standard-runner
# report job commits the PDF + diagnostics back to the branch ([skip ci]), so the
# result is always recoverable from git.  Removed after verification.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: pdflatex --version | head -1

      - name: Compile ADAPTED (fail-soft, capture logs)
        shell: bash
        run: |
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p1.log 2>&1; S1=$?
          bibtex manuscript > bibtex.log 2>&1; SB=$?
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p2.log 2>&1; S2=$?
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p3.log 2>&1; S3=$?
          echo "adapted exit codes: pdflatex1=$S1 bibtex=$SB pdflatex2=$S2 pdflatex3=$S3"
          ls -la manuscript.pdf 2>/dev/null || echo "NO manuscript.pdf"
          echo "== ERROR TAIL (p1) =="; grep -nE "^!|Error|Emergency|Fatal" p1.log | head -40 || true
          echo "== p1 last 60 lines =="; tail -60 p1.log

      - name: Compile ORIGINAL (fail-soft, capture logs)
        shell: bash
        run: |
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig1.log 2>&1
          bibtex PAPER9_ORIGINAL_manuscript > orig_bib.log 2>&1
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig2.log 2>&1
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig3.log 2>&1
          echo "original exit: $?"
          grep "Output written" orig3.log || echo "NO original output line"
          echo "== ORIGINAL ERROR TAIL =="; grep -nE "^!|Error|Emergency|Fatal" orig3.log | head -20 || true

      - name: Diagnostics (always)
        shell: bash
        run: |
          {
            echo "## TeX Live cleanup-verification diagnostics"
            echo ""
            echo '```'
            echo "== ADAPTED (p3) =="
            grep "Output written" p3.log 2>/dev/null || echo "NO 'Output written' — compile failed"
            printf "errors(^!): "; grep -cE "^!" p3.log 2>/dev/null || true
            printf "undefined references: "; grep -c "There were undefined references" p3.log 2>/dev/null || true
            printf "undefined citations: "; grep -c "undefined citation" p3.log 2>/dev/null || true
            printf "overfull boxes: "; grep -c "Overfull" p3.log 2>/dev/null || true
            printf "underfull boxes: "; grep -c "Underfull" p3.log 2>/dev/null || true
            printf "float-too-large: "; grep -c "Float too large" p3.log 2>/dev/null || true
            grep "Float too large" p3.log 2>/dev/null || echo "(no float-too-large)"
            echo ""
            echo "== ADAPTED ERROR LINES (p1, first hit) =="
            grep -nE "^!|l\.[0-9]+|Emergency|Fatal" p1.log 2>/dev/null | head -40 || echo "(none)"
            echo ""
            echo "== ORIGINAL (orig3) =="
            grep "Output written" orig3.log 2>/dev/null || echo "NO 'Output written'"
            printf "errors(^!): "; grep -cE "^!" orig3.log 2>/dev/null || true
            printf "overfull boxes: "; grep -c "Overfull" orig3.log 2>/dev/null || true
            printf "underfull boxes: "; grep -c "Underfull" orig3.log 2>/dev/null || true
            printf "float-too-large: "; grep -c "Float too large" orig3.log 2>/dev/null || true
            grep "Float too large" orig3.log 2>/dev/null || echo "(no float-too-large)"
            echo '```'
            echo "## ADAPTED overfull list (p3)"
            echo '```'
            grep -n "Overfull" p3.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "## ADAPTED float-too-large context (p3)"
            echo '```'
            grep -n -B2 -A2 "Float too large" p3.log 2>/dev/null || echo "(none)"
            echo '```'
          } > diagnostics.txt
          cp diagnostics.txt CI_COMPILE_DIAGNOSTICS.txt
          echo "DIAGNOSTICS:"; cat diagnostics.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/PAPER9_ORIGINAL_manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/p1.log
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/p3.log
          if-no-files-found: warn

  report:
    needs: compile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: compile-results
          path: artifact

      - name: Commit PDF + diagnostics back to branch
        if: always()
        run: |
          mkdir -p Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
          cp artifact/Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf 2>/dev/null || echo "no adapted PDF in artifact"
          cp artifact/Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt 2>/dev/null || echo "no diagnostics in artifact"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf \
                  Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/CI_COMPILE_DIAGNOSTICS.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "NOTHING TO COMMIT"
          else
            git commit -m "CI: TeX Live compile (PDF + diagnostics) [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "PUSH FAILED"
          fi
