name: Compile adapted Paper9 (TeX Live)

# TEMPORARY cleanup-verification workflow — compiles BOTH the adapted manuscript
# (with the new xltabular table containers) AND the authoritative original under
# a genuine TeX Live distribution.  Failure-resilient: diagnostics + PDF are
# committed back to the branch (marked [skip ci]) even when a compile step fails,
# so the error tail is always recoverable from git.  Removed after verification.

on:
  push:
    branches: [arena/01a0d8f7-bfs-fem-matlab]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: pdflatex --version | head -1

      - name: Compile ADAPTED (pdflatex + bibtex + 2x pdflatex)
        shell: bash
        run: |
          mkdir -p compile_out
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p1.log 2>&1
          S1=$?
          bibtex manuscript > bibtex.log 2>&1
          SB=$?
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p2.log 2>&1
          S2=$?
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > p3.log 2>&1
          S3=$?
          {
            echo "exit codes: pdflatex1=$S1 bibtex=$SB pdflatex2=$S2 pdflatex3=$S3"
            echo "== p1 tail ==";     tail -60 p1.log
            echo "== p2 tail ==";     tail -60 p2.log
            echo "== p3 tail ==";     tail -60 p3.log
            echo "== bibtex tail =="; tail -30 bibtex.log
          } > compile_out/adapted_run.txt 2>&1
          ls -la manuscript.pdf 2>/dev/null || echo "NO manuscript.pdf produced"
          echo "RESULTS:"; cat compile_out/adapted_run.txt

      - name: Compile ORIGINAL (authoritative, for parity)
        shell: bash
        run: |
          set +e
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig1.log 2>&1
          bibtex PAPER9_ORIGINAL_manuscript > orig_bib.log 2>&1
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig2.log 2>&1
          pdflatex -interaction=nonstopmode -halt-on-error PAPER9_ORIGINAL_manuscript.tex > orig3.log 2>&1
          echo "exit: $?" > compile_out/original_run.txt
          grep "Output written" orig3.log >> compile_out/original_run.txt 2>&1 || true
          ls -la PAPER9_ORIGINAL_manuscript.pdf 2>/dev/null || echo "NO original PDF"

      - name: Diagnostics
        shell: bash
        run: |
          {
            echo "## TeX Live cleanup-verification diagnostics"
            echo ""
            echo '```'
            echo "== ADAPTED (final pass p3) =="
            grep "Output written" p3.log 2>/dev/null || echo "NO 'Output written' (compile failed — see adapted_run.txt)"
            printf "errors(^!): "; grep -cE "^!" p3.log 2>/dev/null || true
            printf "undefined references: "; grep -c "There were undefined references" p3.log 2>/dev/null || true
            printf "undefined citations: "; grep -c "undefined citation" p3.log 2>/dev/null || true
            printf "overfull boxes: "; grep -c "Overfull" p3.log 2>/dev/null || true
            printf "underfull boxes: "; grep -c "Underfull" p3.log 2>/dev/null || true
            printf "float-too-large: "; grep -c "Float too large" p3.log 2>/dev/null || true
            grep "Float too large" p3.log 2>/dev/null || echo "(no float-too-large)"
            echo ""
            echo "== ORIGINAL (final pass orig3) =="
            grep "Output written" orig3.log 2>/dev/null || echo "NO 'Output written'"
            printf "errors(^!): "; grep -cE "^!" orig3.log 2>/dev/null || true
            printf "overfull boxes: "; grep -c "Overfull" orig3.log 2>/dev/null || true
            printf "underfull boxes: "; grep -c "Underfull" orig3.log 2>/dev/null || true
            printf "float-too-large: "; grep -c "Float too large" orig3.log 2>/dev/null || true
            grep "Float too large" orig3.log 2>/dev/null || echo "(no float-too-large)"
            echo '```'
            echo "## ADAPTED overfull list (p3)"
            echo '```'
            grep -n "Overfull" p3.log 2>/dev/null | head -100
            echo '```'
            echo "## ADAPTED float-too-large context (p3)"
            echo '```'
            grep -n -B2 -A2 "Float too large" p3.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "## COMPILE-STEP TAIL (failure detail if any)"
            echo '```'
            cat compile_out/adapted_run.txt 2>/dev/null
            echo '```'
          } > diagnostics.txt
          cp diagnostics.txt CI_COMPILE_DIAGNOSTICS.txt
          echo "diagnostics written:"; head -40 diagnostics.txt

      - name: Commit compiled PDF + diagnostics back (skip ci)
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cd Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
          [ -f manuscript.pdf ] && git add -f manuscript.pdf || echo "no manuscript.pdf to add"
          [ -f CI_COMPILE_DIAGNOSTICS.txt ] && git add -f CI_COMPILE_DIAGNOSTICS.txt || echo "no diagnostics to add"
          cd "$GITHUB_WORKSPACE"
          if git diff --cached --quiet; then
            echo "No binary/log changes to commit."
          else
            git commit -m "CI: TeX Live cleanup compile (PDF + diagnostics) [skip ci]"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-results
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/PAPER9_ORIGINAL_manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/diagnostics.txt
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/p3.log
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/compile_out/
          if-no-files-found: warn
