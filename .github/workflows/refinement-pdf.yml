name: Build editorial-pass manuscript PDF

on:
  push:
    branches: [arena/01a0dbe8-bfs-fem-matlab]
    paths:
      - 'Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/**/*.tex'
      - '.github/workflows/refinement-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        working-directory: Paper9_FEM3_STYLE_ADAPTED/OVERLEAF
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v4
      - name: Compile manuscript and bibliography
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > compile-1.log 2>&1 || { tail -120 compile-1.log; exit 1; }
          bibtex manuscript > bibtex.log 2>&1 || { cat bibtex.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > compile-2.log 2>&1 || { tail -120 compile-2.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex > compile-3.log 2>&1 || { tail -120 compile-3.log; exit 1; }
          test -s manuscript.pdf
          ls -lh manuscript.pdf
          grep -E 'Output written|Overfull|Underfull|Float too large|undefined references|undefined citation' compile-3.log || true
      - name: Upload diagnostics even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-pass-diagnostics
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/compile-1.log
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/compile-2.log
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/compile-3.log
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/bibtex.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: editorial-pass-pdf
          path: |
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
            Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/compile-3.log

  preserve-failed-build-logs:
    needs: compile
    if: ${{ always() && needs.compile.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the same branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download TeX diagnostics
        uses: actions/download-artifact@v4
        with:
          name: editorial-pass-diagnostics
          path: artifact
      - name: Preserve logs on the branch for diagnosis
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          dest=".github/ci_diagnostics/${RUN_ID}"
          mkdir -p "$dest"
          cp artifact/* "$dest/"
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          git add -f "$dest"/*.log
          git commit -m "CI: preserve TeX failure logs for run ${RUN_ID} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  commit-pdf:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out the same branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: editorial-pass-pdf
          path: artifact
      - name: Commit PDF to the same branch
        run: |
          set -euo pipefail
          pdf_file="$(find artifact -type f -name manuscript.pdf -print -quit)"
          test -n "$pdf_file"
          cp "$pdf_file" Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          git add -f Paper9_FEM3_STYLE_ADAPTED/OVERLEAF/manuscript.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'CI: compile editorial-pass manuscript PDF [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
