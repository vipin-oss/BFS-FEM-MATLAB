  b1_b_cell:
    value: 0.02
    unit: "m"
    tag: "[A]"
    source: "Derived: b = a_A + a_B (source Eq. 51)"
    locked_in_phase: "P12A"
    verified_by: "P12 first-hand source re-extraction"
