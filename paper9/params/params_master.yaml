  b1_c33_B:
    value: "1.62e11"
    unit: "Pa"
    tag: "[A]"
    source: "Li et al. (2024) 'Numerical results and discussions' narrative"
    locked_in_phase: "P12A"
    verified_by: "P12 first-hand source re-extraction; BenchmarkB1 engine"
