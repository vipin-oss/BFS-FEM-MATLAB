# Master parameter registry for Paper 9
# Schema per entry: {name, value, unit, tag, source, locked_in_phase, verified_by}
# Provenance tags: [C] canonical/published, [A] analytical derivation, [S] study/design choice

parameters:
  # Geometry and lattice
  Lcell:
    value: 1.0
    unit: "m"
    tag: "[S]"
    source: "Blueprint Section 3.1 / P4A PARAMS"
    locked_in_phase: "P4A"
    verified_by: "5a-5i test suite"
    description: "Lattice constant of the square periodic cell"

  # Elastic material constants (Case H)
  lambda:
    value: 1.0
    unit: "Pa"
    tag: "[S]"
    source: "Blueprint Section 2.4 / P4A PARAMS"
    locked_in_phase: "P4A"
    verified_by: "5a-5i test suite"
    description: "Lamé first parameter (plane strain ratio lambda/mu = 1.0, Poisson nu = 0.25)"

  mu:
    value: 1.0
    unit: "Pa"
    tag: "[S]"
    source: "Blueprint Section 2.4 / P4A PARAMS"
    locked_in_phase: "P4A"
    verified_by: "5a-5i test suite"
    description: "Lamé second parameter / shear modulus"

  rho:
    value: 1.0
    unit: "kg/m^3"
    tag: "[S]"
    source: "Blueprint Section 2.5 / P4A PARAMS"
    locked_in_phase: "P4A"
    verified_by: "5a-5i test suite"
    description: "Mass density"

  # Gradient and micro-inertia length scales
  ell2:
    value: 0.04
    unit: "m^2"
    tag: "[S]"
    source: "Blueprint Section 2.5 / P4A PARAMS"
    locked_in_phase: "P4A"
    verified_by: "5g-5i test suite"
    description: "Micro-inertia parameter squared (ell = 0.20 m, ellbar = 0.20)"

  l_iso:
    value: 0.20
    unit: "m"
    tag: "[S]"
    source: "Blueprint Section 2.7 / P4A PARAMS"
    locked_in_phase: "P4A"
    verified_by: "5c, 5g, 5h"
    description: "Isotropic characteristic length scale for AR = 1 (lbar = 0.20)"

  # Baseline anisotropic length scales
  l1_aniso:
    value: 0.30
    unit: "m"
    tag: "[S]"
    source: "P4A PARAMS (test 5e)"
    locked_in_phase: "P4A"
    verified_by: "5e"
    description: "Anisotropic major semi-axis length scale for AR = 3 test case"

  l2_aniso:
    value: 0.10
    unit: "m"
    tag: "[S]"
    source: "P4A PARAMS (test 5e)"
    locked_in_phase: "P4A"
    verified_by: "5e"
    description: "Anisotropic minor semi-axis length scale for AR = 3 test case"

  # Aspect ratio scaling rule for production sweeps
  ar_scaling_rule:
    value: "volume_equivalent"
    unit: "dimensionless"
    tag: "[S]"
    source: "Blueprint Section 2.1; invariant det(A^T A) = l_iso^4; l1=l_iso*sqrt(AR), l2=l_iso/sqrt(AR)"
    locked_in_phase: "P5"
    verified_by: "Determinant invariance check det(L) == l_iso^4"
    description: "Area-preserving / volume-equivalent ellipsoid semi-axes: l1 = l_iso*sqrt(AR), l2 = l_iso/sqrt(AR)"

  # Production sweep parameters
  theta_sweep_deg:
    value: [0.0, 15.0, 30.0, 45.0, 60.0, 75.0, 90.0]
    unit: "deg"
    tag: "[S]"
    source: "Blueprint Section 6.4, 6.6; CALC_MASTER_PLAN Study S3, S5"
    locked_in_phase: "P5"
    verified_by: "Study S3, S5, S6"
    description: "Orientation angle sweep set (7 values)"

  ar_sweep:
    value: [1.0, 2.0, 3.0, 5.0, 7.0, 10.0]
    unit: "dimensionless"
    tag: "[S]"
    source: "Blueprint Section 6.5, 6.6; CALC_MASTER_PLAN Study S4, S5"
    locked_in_phase: "P5"
    verified_by: "Study S4, S5, S6"
    description: "Microstructural aspect ratio sweep set (6 values)"

  # Resolution and discretisation (TV4)
  N_seg:
    value: 40
    unit: "dimensionless"
    tag: "[S]"
    source: "TV4 lock in P5; 40 points per segment => 121 path nodes"
    locked_in_phase: "P5"
    verified_by: "Pilot convergence and P4B resolution floor"
    description: "Number of sampling segments per path leg along Gamma-X-M-Gamma"

  N_kx_2d:
    value: 41
    unit: "dimensionless"
    tag: "[S]"
    source: "TV4 lock in P5; uniform sampling of half-BZ kx in [0, pi/L]"
    locked_in_phase: "P5"
    verified_by: "Pilot 2D BZ coverage"
    description: "Grid points in kx for 2D half-BZ complete-gap and IFC evaluations"

  N_ky_2d:
    value: 81
    unit: "dimensionless"
    tag: "[S]"
    source: "TV4 lock in P5; uniform sampling of half-BZ ky in [-pi/L, pi/L]"
    locked_in_phase: "P5"
    verified_by: "Pilot 2D BZ coverage"
    description: "Grid points in ky for 2D half-BZ complete-gap and IFC evaluations"

  # Reported bands and filter (TV7)
  N_elem_per_side:
    value: 16
    unit: "dimensionless"
    tag: "[S]"
    source: "P5 mesh-refinement repair (2026-09-24): n x n BFS elements per unit cell; the pre-repair production used n = 1"
    locked_in_phase: "P5-mesh16"
    verified_by: "P4B assembly-equivalence check (<= 1.2e-13) and P5 mesh-16 run log"
    description: "Element order of the BFS discretisation per unit cell (h = L/n = 0.0625, 8n^2 = 2048 DOF per cell)"

  N_bands_reported:
    value: 4
    unit: "dimensionless"
    tag: "[S]"
    source: "TV7 lock in P5; lowest 4 physical acoustic/shear/longitudinal branches"
    locked_in_phase: "P5"
    verified_by: "Pilot MAC continuity"
    description: "Number of lowest physical band functions extracted and tracked"

  # Tolerances and resolution floor
  tol_hermiticity:
    value: 1.0e-12
    unit: "dimensionless"
    tag: "[S]"
    source: "P4A/P4B tolerance specification"
    locked_in_phase: "P4A"
    verified_by: "5a, P5 pilot"
    description: "Max relative Frobenius norm for matrix Hermiticity"

  tol_symmetry:
    value: 1.0e-10
    unit: "dimensionless"
    tag: "[S]"
    source: "P4A/P4B tolerance specification"
    locked_in_phase: "P4A"
    verified_by: "5b, 5c, 5e, P5 pilot"
    description: "Max relative eigenvalue discrepancy for symmetry checks"

  eps_Delta:
    value: 4.63e-11
    unit: "dimensionless"
    tag: "[A]"
    source: "P4B 5i mesh convergence study (commit 1581497)"
    locked_in_phase: "P4B"
    verified_by: "5i"
    description: "Numerical resolution floor of the BFS Bloch solver"

  # Case C / Study S2 Two-Phase Metamaterial Parameters
  rho_matrix:
    value: 1142.0
    unit: "kg/m^3"
    tag: "[A]"
    source: "Zhan & Wei (2010) Table 1 (Epoxy matrix)"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Mass density of Epoxy matrix"

  mu_matrix:
    value: 1.48e9
    unit: "Pa"
    tag: "[A]"
    source: "Zhan & Wei (2010) Table 1 (Epoxy matrix)"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Shear modulus of Epoxy matrix"

  lambda_matrix:
    value: 4.57e9
    unit: "Pa"
    tag: "[A]"
    source: "Zhan & Wei (2010) Table 1 (Epoxy matrix)"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Lamé first parameter of Epoxy matrix"

  rho_inclusion:
    value: 6333.0
    unit: "kg/m^3"
    tag: "[A]"
    source: "Zhan & Wei (2010) Table 1 (YBCO inclusion)"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Mass density of YBCO inclusion"

  mu_inclusion:
    value: 3.70e10
    unit: "Pa"
    tag: "[A]"
    source: "Zhan & Wei (2010) Table 1 (YBCO inclusion)"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Shear modulus of YBCO inclusion"

  lambda_inclusion:
    value: 9.50e10
    unit: "Pa"
    tag: "[A]"
    source: "Zhan & Wei (2010) Table 1 (YBCO inclusion)"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Lamé first parameter of YBCO inclusion"

  r0_over_a:
    value: 0.30
    unit: "dimensionless"
    tag: "[S]"
    source: "Study design choice for f = 28.27% circular inclusion"
    locked_in_phase: "P11"
    verified_by: "Case C convergence"
    description: "Radius ratio of circular inclusion r0/L"

  c_t_matrix:
    value: 1138.4
    unit: "m/s"
    tag: "[A]"
    source: "Derived: sqrt(mu_matrix / rho_matrix)"
    locked_in_phase: "P11"
    verified_by: "Nondimensionalization audit"
    description: "Transverse acoustic shear velocity of Epoxy matrix"

  omega0_caseC:
    value: 3576.4
    unit: "rad/s"
    tag: "[A]"
    source: "Derived: pi * c_t_matrix / Lcell"
    locked_in_phase: "P11"
    verified_by: "Nondimensionalization audit"
    description: "Characteristic Bragg frequency scale for Case C"


# ---------------------------------------------------------------------------
# P12A (2026-09-23) PCR6 additions: Benchmark B1/B2/B3 parameter registry rows.
# Every B1/B2/B3 material/geometric/microstructural parameter that reaches the
# results (Table 3 gaps, Section 5.1 text, registries) is now tagged here.
# TAG-CONVENTION NOTE (documented drift, PI decision pending): the legacy YAML
# header above reads "[C] canonical/published, [A] analytical derivation,
# [S] study/design choice", while the live manuscript legend (sec05) reads
# "Study [S] vs Anchor [A]" and existing rows tag author-published anchor
# constants AND derived quantities as [A] (e.g. Zhan & Wei Table 1 rows,
# c_t_matrix).  For internal consistency of the artifact, the rows below
# follow the LIVE convention: [A] = anchor-published or derived-from-published,
# [S] = study/design/inherited.  No existing row was retagged; no gate or PCR
# definition was changed (PCR6 requires a [C]/[A]/[S] tag; the letter choice
# per class is documented here).
# ---------------------------------------------------------------------------

  b1_rho_A:
    value: 3230.0
    unit: "kg/m^3"
    tag: "[A]"
    source: "Li et al. (2024) 'Numerical results and discussions' narrative (the paper contains no tables)"
    locked_in_phase: "P12A"
    verified_by: "P12 first-hand source re-extraction; BenchmarkB1 engine"
    description: "Mass density of AlN layer A (B1/B2 bilayer)"

  b1_c33_A:
