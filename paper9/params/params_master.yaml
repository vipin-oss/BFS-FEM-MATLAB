  b1_a3_B:
    value: "1.26e-8"
    unit: "C^2/Nm^2"
    tag: "[A]"
    source: "Li et al. (2024) 'Numerical results and discussions' narrative"
    locked_in_phase: "P12A"
    verified_by: "P12 first-hand source re-extraction"
